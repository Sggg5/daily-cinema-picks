<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>今日片单</title><style>@import url('https://fonts.googleapis.com/css2?family=DM+Mono&family=Noto+Serif+SC:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');*{box-sizing:border-box}body{margin:0;background:#f4f1eb;color:#1c1b19;font-family:'Plus Jakarta Sans','Noto Serif SC',sans-serif}main{max-width:1320px;margin:auto;padding:0 42px}nav{height:100px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #d4d0c7}.brand{font-size:24px;font-weight:700;letter-spacing:-1.5px}.brand span{font-size:10px;vertical-align:top}.nav-date,.eyebrow{font:11px 'DM Mono';letter-spacing:1.3px;color:#747067}button{font-family:inherit;cursor:pointer}.quiet{border:0;background:transparent;font-size:12px}.hero{min-height:610px;display:grid;grid-template-columns:51% 49%;gap:72px;align-items:center;padding:68px 6%}.poster{height:510px;position:relative;overflow:hidden;background:var(--accent)}.poster:after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.28),transparent 55%)}.poster img{width:100%;height:100%;object-fit:cover;filter:saturate(.8)}.mark{position:absolute;bottom:23px;left:24px;color:#fff;z-index:1;font:11px 'DM Mono';letter-spacing:2px}h1{font:700 clamp(44px,6vw,82px) 'Noto Serif SC';letter-spacing:-5px;margin:12px 0 0}.english{font:13px 'DM Mono';letter-spacing:1px;color:#777168;margin:12px 0 26px}.meta{font-size:12px;color:#68645d}.dot{display:inline-block;width:3px;height:3px;background:var(--accent);border-radius:50%;margin:0 10px;vertical-align:middle}blockquote{font:600 25px/1.55 'Noto Serif SC';margin:45px 0 22px;max-width:450px}.note{font-size:14px;line-height:1.9;color:#635e56;max-width:410px}.actions{display:flex;gap:12px;margin-top:34px}.primary,.outline{padding:13px 20px;border-radius:0;font-size:12px;font-weight:600}.primary{background:#1c1b19;color:#fff;border:1px solid #1c1b19}.outline{border:1px solid #b8b3aa;background:transparent}.details{border-top:1px solid #d4d0c7;border-bottom:1px solid #d4d0c7;padding:28px 6%;display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.details div+div{border-left:1px solid #d4d0c7;padding-left:42px}.details span{display:block;font-size:11px;color:#777168;margin-bottom:8px}.details strong{font:600 16px 'Noto Serif SC'}.details em{font:11px 'DM Mono';font-style:normal;color:#777168}.calendar{padding:75px 6% 60px;display:grid;grid-template-columns:30% 1fr;gap:30px}.calendar h2{font:600 32px 'Noto Serif SC';margin:10px 0}.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid #c9c4ba}.tabs button{padding:18px 8px;text-align:left;border:0;border-bottom:1px solid #c9c4ba;background:transparent;color:#777168}.tabs button.active{color:#1c1b19;border-bottom:3px solid var(--accent)}.tabs b{font:10px 'DM Mono';display:block;margin-bottom:12px}.tabs span{font:600 14px 'Noto Serif SC'}footer{border-top:1px solid #d4d0c7;padding:25px 0 35px;font-size:11px;color:#777168;display:flex;justify-content:space-between}@media(max-width:740px){main{padding:0 20px}nav{height:76px}.nav-date{display:none}.hero{display:block;padding:35px 0 48px}.poster{height:420px}h1{font-size:52px;letter-spacing:-3px;margin-top:28px}blockquote{font-size:21px;margin-top:30px}.details{padding:24px 0;grid-template-columns:1fr;gap:20px}.details div+div{padding-left:0;border-left:0}.calendar{padding:48px 0;display:block}.tabs{margin-top:25px;grid-template-columns:repeat(2,1fr)}footer{line-height:1.7;gap:15px}}</style><main id="app"></main><script>const films=[['徒手攀岩','Free Solo','2018 · 美国','纪录片 / 运动','100 min','8.9','伊丽莎白·柴·瓦沙瑞莉、金国威','准备 → 拆解 → 练习 → 修正 → 最后执行。','当一座 900 米岩壁被拆成一个个动作，极端勇气也显出极端理性的轮廓。','#bb5c31','https://images.unsplash.com/photo-1526481280695-3c687fd643ed?auto=format&fit=crop&w=1400&q=88'],['海上钢琴师','The Legend of 1900','1998 · 意大利','剧情 / 音乐','170 min','9.3','朱塞佩·托纳多雷','陆地对我来说太大了。','献给那些把热爱留给自己、把世界留在心里的人。','#8c3d2d','https://images.unsplash.com/photo-1485846234645-a62644f84728?auto=format&fit=crop&w=1400&q=88'],['白日梦想家','The Secret Life of Walter Mitty','2013 · 美国','喜剧 / 剧情 / 冒险','114 min','8.6','本·斯蒂勒','去看世界，去冒险，去超越。','当生活需要一点勇气时，这部电影会推你向前一步。','#27516a','https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1400&q=88'],['小森林','Little Forest','2018 · 韩国','剧情 / 治愈','103 min','8.9','林顺礼','好好吃饭，就是好好生活。','给疲惫的你，一份不急着抵达的温柔。','#456543','https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=1400&q=88'],['爱在黎明破晓前','Before Sunrise','1995 · 美国','爱情 / 剧情','101 min','8.8','理查德·林克莱特','如果世界有魔法，那一定在相遇里。','适合在一个不需要赶路的夜晚，慢慢看完。','#b76b48','https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1400&q=88']];let i=(new Date().getDate()+3)%films.length,s=localStorage.saved==='1';function render(){let f=films[i],d=new Date();app.innerHTML='<nav><b class="brand">24<span>FPS</span></b><div class="nav-date">'+d.getFullYear()+' / '+String(d.getMonth()+1).padStart(2,'0')+' / '+String(d.getDate()).padStart(2,'0')+'</div><button class="quiet" onclick="shareFilm()">分享推荐 ↗</button></nav><section class="hero"><div class="poster"><img src="'+f[10]+'" alt="'+f[0]+' 氛围海报"><div class="mark">TODAY\'S<br>MOVIE</div></div><article><p class="eyebrow">DAILY CINEMA · NO. '+String(i+1).padStart(2,'0')+'</p><h1>'+f[0]+'</h1><p class="english">'+f[1]+'</p><p class="meta">'+f[2]+'<span class="dot"></span>'+f[3]+'<span class="dot"></span>'+f[4]+'</p><blockquote>“'+f[7]+'”</blockquote><p class="note">'+f[8]+'</p><div class="actions"><button class="primary" onclick="toggle()">'+(s?'已收藏 ✓':'收藏今天')+'</button><button class="outline" onclick="next()">换一部电影</button></div></article></section><section class="details"><div><span>导演</span><strong>'+f[6]+'</strong></div><div><span>豆瓣评分</span><strong>'+f[5]+'<em> / 10</em></strong></div><div><span>观影建议</span><strong>大屏幕，留足时间</strong></div></section><section class="calendar"><div><p class="eyebrow">THIS WEEK</p><h2>本周片单</h2></div><div class="tabs">'+films.map((x,n)=>'<button class="'+(n===i?'active':'')+'" onclick="pick('+n+')"><b>'+String(n+1).padStart(2,'0')+'</b><span>'+x[0]+'</span></button>').join('')+'</div></section><footer>每天一部好电影，给生活留一束光。<span>© 2026 24FPS</span></footer>';app.style.setProperty('--accent',f[9])}function pick(n){i=n;render()}function next(){i=(i+1)%films.length;render()}function toggle(){s=!s;localStorage.saved=s?'1':'0';render()}async function shareFilm(){let t='今日推荐：'+films[i][0]+'｜'+films[i][7];if(navigator.share)navigator.share({title:'今日片单',text:t});else{navigator.clipboard.writeText(t);alert('推荐文案已复制')}}render()</script></html>
