<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>今日片单</title><style>@import url('https://fonts.googleapis.com/css2?family=DM+Mono&family=Noto+Serif+SC:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');*{box-sizing:border-box}body{margin:0;background:#f4f1eb;color:#1c1b19;font-family:'Plus Jakarta Sans','Noto Serif SC',sans-serif}main{max-width:1320px;margin:auto;padding:0 42px}nav{height:100px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #d4d0c7}.brand{font-size:24px;font-weight:700;letter-spacing:-1.5px}.brand span{font-size:10px;vertical-align:top}.nav-date,.eyebrow{font:11px 'DM Mono';letter-spacing:1.3px;color:#747067}button{font-family:inherit;cursor:pointer}.quiet{border:0;background:transparent;font-size:12px}.hero{min-height:610px;display:grid;grid-template-columns:51% 49%;gap:72px;align-items:center;padding:68px 6%}.poster{height:510px;position:relative;overflow:hidden;background:var(--accent)}.poster:after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.28),transparent 55%)}.poster img{width:100%;height:100%;object-fit:cover;filter:saturate(.8)}.mark{position:absolute;bottom:23px;left:24px;color:#fff;z-index:1;font:11px 'DM Mono';letter-spacing:2px}h1{font:700 clamp(44px,6vw,82px) 'Noto Serif SC';letter-spacing:-5px;margin:12px 0 0}.english{font:13px 'DM Mono';letter-spacing:1px;color:#777168;margin:12px 0 26px}.meta{font-size:12px;color:#68645d}.dot{display:inline-block;width:3px;height:3px;background:var(--accent);border-radius:50%;margin:0 10px;vertical-align:middle}blockquote{font:600 25px/1.55 'Noto Serif SC';margin:45px 0 22px;max-width:450px}.note{font-size:14px;line-height:1.9;color:#635e56;max-width:385px}.actions{display:flex;gap:12px;margin-top:34px}.primary,.outline{padding:13px 20px;border-radius:0;font-size:12px;font-weight:600}.primary{background:#1c1b19;color:#fff;border:1px solid #1c1b19}.outline{border:1px solid #b8b3aa;background:transparent}.details{border-top:1px solid #d4d0c7;border-bottom:1px solid #d4d0c7;padding:28px 6%;display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.details div+div{border-left:1px solid #d4d0c7;padding-left:42px}.details span{display:block;font-size:11px;color:#777168;margin-bottom:8px}.details strong{font:600 16px 'Noto Serif SC'}.details em{font:11px 'DM Mono';font-style:normal;color:#777168}.calendar{padding:75px 6% 60px;display:grid;grid-template-columns:30% 1fr;gap:30px}.calendar h2{font:600 32px 'Noto Serif SC';margin:10px 0}.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #c9c4ba}.tabs button{padding:18px 8px;text-align:left;border:0;border-bottom:1px solid #c9c4ba;background:transparent;color:#777168}.tabs button.active{color:#1c1b19;border-bottom:3px solid var(--accent)}.tabs b{font:10px 'DM Mono';display:block;margin-bottom:12px}.tabs span{font:600 14px 'Noto Serif SC'}footer{border-top:1px solid #d4d0c7;padding:25px 0 35px;font-size:11px;color:#777168;display:flex;justify-content:space-between}@media(max-width:740px){main{padding:0 20px}nav{height:76px}.nav-date{display:none}.hero{display:block;padding:35px 0 48px}.poster{height:420px}h1{font-size:52px;letter-spacing:-3px;margin-top:28px}blockquote{font-size:21px;margin-top:30px}.details{padding:24px 0;grid-template-columns:1fr;gap:20px}.details div+div{padding-left:0;border-left:0}.calendar{padding:48px 0;display:block}.tabs{margin-top:25px;grid-template-columns:repeat(2,1fr)}footer{line-height:1.7;gap:15px}}</style><main id="app"></main><script>const films=[['千钧一发','Gattaca','1997 · 美国','科幻 / 剧情 / 惊悚','106 min','8.8','安德鲁·尼科尔','我从不为回程保留力气。','在基因决定前途的世界里，一个被判定不够完美的人仍想飞向星空。它用冷静的未来寓言追问：一个人的可能性，究竟能否被出生时的数据定义？','#a7773b','/images/gattaca.png'],['午餐盒','The Lunchbox','2013 · 印度 / 法国 / 德国 / 美国','剧情 / 爱情','104 min','8.1','赖舒·彼查','有时候，错送的一餐饭会带来对的人。','一次送错的午餐盒，让两位陌生人开始用便签交换生活。它不急着制造浪漫，只让孤独的人在日常琐碎里，慢慢重新相信被理解的可能。','#bb7a36','/images/the-lunchbox.png'],['辉夜姬物语','The Tale of the Princess Kaguya','2013 · 日本','动画 / 奇幻 / 剧情','137 min','8.5','高畑勋','活着，就是为了感受这世间的光。','从竹子里降临的少女，被繁华推着远离自己。水墨般奔涌的画面里，它讲的是成长、自由，以及我们为什么舍不得这个并不完美的世界。','#66717f','/images/princess-kaguya.png'],['燃烧','Burning','2018 · 韩国','悬疑 / 剧情 / 犯罪','148 min','8.0','李沧东','有些火，烧起来时没有声音。','一桩失踪、一个神秘的温室习惯，和三个始终互相错开的年轻人。它把不安埋进日常细节里，越安静，越让人无法移开眼睛。','#29445f','/images/burning.png'],['寿司之神','Jiro Dreams of Sushi','2011 · 美国 / 日本','纪录片 / 美食','81 min','8.3','大卫·贾柏','一生只做好一件事，也足够了。','镜头跟随一位寿司职人，把重复变成了修行。它拍的并不只是美食，而是对细节永不妥协的专注，以及把热爱做到极致的耐心。','#8c6a45','/images/jiro-dreams-of-sushi.png'],['阳光小美女','Little Miss Sunshine','2006 · 美国','喜剧 / 剧情 / 公路','101 min','8.3','乔纳森·戴顿、维莱莉·法瑞斯','你不必先赢，才配上台。','一辆快要散架的黄巴士，载着一群各有烦恼的家人奔向儿童选美赛。它荒唐又温柔：原来真正的支持，是允许彼此不够完美。','#d49a35','/images/little-miss-sunshine.png'],['红海龟','The Red Turtle','2016 · 法国 / 比利时 / 日本','动画 / 奇幻 / 剧情','80 min','7.8','迈克尔·度德威特','有些故事，不必用语言讲完。','一座荒岛、一只红海龟与漫长的潮汐。几乎没有对白，它却用风、海浪和每一次相遇，讲完了关于孤独、爱与告别的一生。','#bb6248','/images/the-red-turtle.png'],['完美的日子','Perfect Days','2023 · 日本 / 德国','剧情 / 治愈','124 min','8.4','维姆·文德斯','今天也是好天气。','东京清洁工平山把每一天过成固定而安静的仪式：磁带、树影、读书与微笑。它不讲大道理，却让人重新发现平凡生活里闪光的细节。','#536756','/images/perfect-days.png'],['月球','Moon','2009 · 英国','科幻 / 剧情 / 悬疑','97 min','8.5','邓肯·琼斯','我不是你，但我也是你。','月球基地的孤独工人发现自己并不孤单；它用最小的空间拍出最大的问题：记忆与自我，究竟由什么构成。','#71839a','/images/moon.png'],['十二怒汉','12 Angry Men','1957 · 美国','悬疑 / 剧情 / 法庭','96 min','9.4','西德尼·吕美特','偏见会扭曲事实。','十二个陌生人困在陪审室里，一句“我不确定”撬动了全部共识；它告诉我们，认真怀疑是对他人最基本的尊重。','#50535a','/images/twelve-angry-men.png'],['一次别离','A Separation','2011 · 伊朗 / 法国','剧情 / 家庭','123 min','8.8','阿斯哈·法哈蒂','每个人都觉得自己是对的。','一场离婚、一次照护与一连串看似普通的选择，让所有人都陷进两难；它没有简单的好人坏人，只有生活本身的重量。','#b88c5d','/images/a-separation.png'],['内布拉斯加','Nebraska','2013 · 美国','公路 / 剧情 / 家庭','115 min','8.6','亚历山大·佩恩','有时候，人总得有个盼头。','一张可能中奖的传单，让父子踏上横穿内布拉斯加的旅程；黑白影像冷静幽默，却把亲情里那些没说出口的话照得很亮。','#72777e','/images/nebraska.png'],['红辣椒','Paprika','2006 · 日本','动画 / 科幻 / 悬疑','90 min','9.0','今敏','梦境，是通往内心的门。','当梦可以被进入与盗取，现实便开始松动；今敏把潜意识拍成一场华丽又危险的游行，越看越舍不得眨眼。','#b22d34','/images/paprika.png'],['我的章鱼老师','My Octopus Teacher','2020 · 南非','纪录片','85 min','9.3','皮帕·埃尔利希、詹姆斯·里德','真正的关系，需要时间。','一位潜水者在海藻森林里与一只章鱼相遇；它没有煽情地解释自然，却让你重新感到生命之间的距离与连接。','#347e8d','/images/my-octopus-teacher.png'],['冰血暴','Fargo','1996 · 美国 / 英国','黑色喜剧 / 犯罪 / 剧情','98 min','8.0','乔尔·科恩','人生哪有那么多钱值得你搭上一切。','明尼苏达的漫天雪地里，一桩荒唐绑架越滚越大；它的冷幽默越平静，人物的贪婪就越显得可笑又可怕。','#778ca1','/images/fargo.png'],['银翼杀手 2049','Blade Runner 2049','2017 · 美国 / 加拿大 / 英国','科幻 / 悬疑 / 剧情','163 min','8.3','丹尼斯·维伦纽瓦','有时，为了爱一个人，你必须成为陌生人。','在霓虹、雨水与废墟之间，它用缓慢而巨大的画面追问：记忆、爱情和灵魂，究竟哪一样让人真正成为人。','#b06c2c','/images/blade-runner-2049.png'],['燃情岁月','Legends of the Fall','1994 · 美国','剧情 / 爱情 / 战争','133 min','8.8','爱德华·兹威克','有些人能听见自己内心深处的声音。','一座牧场、三兄弟与跨越半生的爱恨；它把命运的失控拍得辽阔而浓烈，也把每一次选择都留在风里。','#a96832','/images/legends-of-the-fall.png'],['巴黎，德州','Paris, Texas','1984 · 西德 / 法国 / 英国 / 美国','公路 / 剧情','145 min','8.7','维姆·文德斯','我曾经认识一个女人。','一个沉默的男人穿过美国西南部寻找失去的家；它把公路拍成一段关于记忆、亏欠与重新说话的旅程。','#c16d5c','/images/paris-texas.png'],['狼的孩子雨和雪','Wolf Children','2012 · 日本','动画 / 剧情 / 家庭','117 min','8.7','细田守','无论你选择哪条路，都要好好地活下去。','一个母亲带着两个特别的孩子搬进山里；它把成长拍得既温柔又残酷，最后讲的是每个人都要找到属于自己的活法。','#66865b','/images/wolf-children.png'],['寻找小糖人','Searching for Sugar Man','2012 · 瑞典 / 英国','纪录片 / 音乐 / 悬疑','86 min','9.2','马利克·本德让劳尔','有些歌，消失了也仍在被人传唱。','两位歌迷追寻一位神秘民谣歌手的下落；它像侦探片一样推进，却在最后讲出音乐如何悄悄改变陌生人的人生。','#5c6b70','/images/searching-for-sugar-man.png'],['两杆大烟枪','Lock, Stock and Two Smoking Barrels','1998 · 英国','黑色喜剧 / 犯罪','107 min','9.1','盖·里奇','人生有时候就是一手烂牌。','一场牌局惹出一串荒唐麻烦，所有人都以为自己掌握全局；盖·里奇用飞快节奏把伦敦拍成一台失控的喜剧机器。','#596239','/images/lock-stock.png'],['降临','Arrival','2016 · 美国 / 加拿大','科幻 / 剧情 / 悬疑','116 min','7.8','丹尼斯·维伦纽瓦','语言是文明的基础。','外星飞船降临之后，它最在意的不是“它们从哪里来”，而是“我们该怎样理解彼此”；一次沟通，慢慢改变了时间的形状。','#6b746e','/images/arrival.png'],['海边的曼彻斯特','Manchester by the Sea','2016 · 美国','剧情 / 家庭','137 min','8.6','肯尼斯·罗纳根','有些伤口，不会愈合。','它不急着替悲伤找答案，只安静地陪你看一个人怎样带着无法修复的部分，继续往前生活。','#4f7186','/images/manchester-by-the-sea.png'],['摩托日记','The Motorcycle Diaries','2004 · 阿根廷 / 智利','公路 / 剧情 / 传记','126 min','8.5','沃尔特·塞勒斯','让世界改变你，然后你再去改变世界。','一辆老旧摩托车、两位年轻人和一整片南美大陆；它把一次旅行拍成了一个人开始理解世界的过程。','#b67b37','/images/motorcycle-diaries.png'],['东京教父','Tokyo Godfathers','2003 · 日本','动画 / 剧情 / 喜剧','92 min','9.0','今敏','每个人都有自己的故事。','三个流落街头的人，在雪夜捡到一个婴儿；一连串巧合把他们带回彼此的生活，也带回重新相信世界的理由。','#2f5b83','/images/tokyo-godfathers.png'],['控方证人','Witness for the Prosecution','1957 · 美国','悬疑 / 剧情 / 犯罪','116 min','9.6','比利·怀尔德','别泄露结局。','一桩看似清楚的谋杀案，在证词与反证之间不断翻面；它证明最锋利的悬疑，从不靠大声说话。','#9c8155','/images/witness-for-the-prosecution.png'],['无间道','Infernal Affairs','2002 · 中国香港','犯罪 / 剧情 / 惊悚','101 min','9.3','刘伟强、麦兆辉','出来混，迟早要还的。','两名卧底在城市的霓虹与暗处交换命运；它让“身份”成为一场没有人能全身而退的考验。','#36556b','/images/infernal-affairs.png'],['人生果实','Life Is Fruity','2017 · 日本','纪录片','91 min','9.3','伏原健之','风吹枯叶落，落叶滋养了新芽。','一对建筑师夫妇用半个世纪说明：把日子过得细小、具体、彼此照应，本身就是一种丰盛。','#66854a','/images/life-is-fruity.png'],['爱乐之城','La La Land','2016 · 美国','剧情 / 爱情 / 音乐','128 min','8.4','达米恩·查泽雷','献给所有为理想孤身前行的人。','当梦想与爱情无法同步抵达，它仍教会我们：有些相遇，会在往后的每一次起舞里发光。','#795493','/images/la-la-land.png'],['布达佩斯大饭店','The Grand Budapest Hotel','2014 · 美国 / 德国','喜剧 / 剧情 / 冒险','100 min','8.9','韦斯·安德森','为了小小的快乐，必须成为大大的冒险家。','一座粉色饭店、一群认真得荒唐的人：它把优雅、友情和混乱调成了一杯精致的甜酒。','#d27c91','/images/grand-budapest.png'],['海街日记','Our Little Sister','2015 · 日本','剧情 / 家庭','128 min','8.8','是枝裕和','有些告别不是结束，而是让我们重新学会如何相爱。','在海风、梅酒与日常琐事里，四姐妹把各自的缺口慢慢缝成了一个家。','#7895a0','/images/our-little-sister.png'],['菊次郎的夏天','Kikujiro','1999 · 日本','剧情 / 喜剧 / 公路','121 min','8.9','北野武','喂，去哪里啊？去看海。','一场偏离计划的夏日旅程，让两个不会表达温柔的人，在路上慢慢成为彼此的依靠。','#4c899b','/images/kikujiro.png'],['看不见的客人','Contratiempo','2016 · 西班牙','悬疑 / 犯罪 / 剧情','106 min','8.8','奥里奥尔·保罗','真相只有一个，但通往真相的路有很多条。','一间密室、两位叙述者、不断改写的细节；它让你直到最后一刻仍在怀疑自己看见的东西。','#35556b','/images/invisible-guest.png'],['千与千寻','Spirited Away','2001 · 日本','动画 / 奇幻 / 冒险','125 min','9.4','宫崎骏','人生就是一列开往坟墓的列车，路途上会有很多站。','关于成长最温柔的提醒：即使走进陌生世界，也别丢掉自己的名字与善意。','#9b554e','/images/spirited-away.png'],['星际穿越','Interstellar','2014 · 美国 / 英国','科幻 / 剧情 / 冒险','169 min','9.4','克里斯托弗·诺兰','爱是唯一可以超越时间与空间的事物。','当世界向内收缩时，它仍邀请我们抬头：把好奇、勇气与牵挂一起带向未知。','#28628d','/images/interstellar.png'],['荒蛮故事','Relatos salvajes','2014 · 阿根廷 / 西班牙','黑色喜剧 / 剧情','122 min','8.8','达米安·斯兹弗隆','当文明失去耐心，荒诞就开始接管一切。','六个失控瞬间，把愤怒、体面和报复推到最荒唐也最痛快的边缘。','#59666e','/images/wild-tales.png'],['徒手攀岩','Free Solo','2018 · 美国','纪录片 / 运动','100 min','8.9','伊丽莎白·柴·瓦沙瑞莉、金国威','准备、拆解、练习，然后执行。','当一座九百米峭壁被拆成一个个动作，极限勇气也显出极端理性的轮廓。','#bb5c31','/images/free-solo.png'],['海上钢琴师','The Legend of 1900','1998 · 意大利','剧情 / 音乐','170 min','9.3','朱塞佩·托纳多雷','陆地对我来说太大了。','献给那些把热爱留给自己、把世界留在心里的人。','#8c3d2d','https://images.unsplash.com/photo-1485846234645-a62644f84728?auto=format&fit=crop&w=1400&q=88'],['白日梦想家','The Secret Life of Walter Mitty','2013 · 美国','喜剧 / 剧情 / 冒险','114 min','8.6','本·斯蒂勒','去看世界，去冒险，去超越。','当生活需要一点勇气时，这部电影会推你向前一步。','#27516a','https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1400&q=88'],['小森林','Little Forest','2018 · 韩国','剧情 / 治愈','103 min','8.9','林顺礼','好好吃饭，就是好好生活。','给疲惫的你，一份不急着抵达的温柔。','#456543','https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=1400&q=88'],['爱在黎明破晓前','Before Sunrise','1995 · 美国','爱情 / 剧情','101 min','8.8','理查德·林克莱特','如果世界有魔法，那一定在相遇里。','适合在一个不需要赶路的夜晚，慢慢看完。','#b76b48','https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1400&q=88']];let i=0,s=localStorage.saved==='1';function render(){let f=films[i],d=new Date();app.innerHTML='<nav><b class="brand">24<span>FPS</span></b><div class="nav-date">'+d.getFullYear()+' / '+String(d.getMonth()+1).padStart(2,'0')+' / '+String(d.getDate()).padStart(2,'0')+'</div><button class="quiet" onclick="shareFilm()">分享推荐 ↗</button></nav><section class="hero"><div class="poster"><img src="'+f[10]+'" alt="'+f[0]+' 氛围海报"><div class="mark">TODAY\'S<br>MOVIE</div></div><article><p class="eyebrow">DAILY CINEMA · NO. '+String(i+1).padStart(2,'0')+'</p><h1>'+f[0]+'</h1><p class="engli
